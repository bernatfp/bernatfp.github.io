<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Bernat Fages</title>
	<meta name="description" content="Bernat Fages — personal site.">
	<link rel="canonical" href="https://bernat.xyz/">
	<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90' font-family='system-ui,sans-serif'>B</text></svg>">

	<meta property="og:type" content="website">
	<meta property="og:title" content="Bernat Fages">
	<meta property="og:description" content="Bernat Fages — personal site.">
	<meta property="og:url" content="https://bernat.xyz/">
	<meta name="twitter:card" content="summary">

	<style>
		:root {
			--bg: #fbfbfa;
			--fg: #161614;
			--muted: #6b6b66;
		}

		@media (prefers-color-scheme: dark) {
			:root {
				--bg: #101010;
				--fg: #ededea;
				--muted: #8a8a84;
			}
		}

		* { box-sizing: border-box; }

		html { -webkit-text-size-adjust: 100%; }

		body {
			margin: 0;
			min-height: 100vh;
			min-height: 100svh;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 2rem 1.5rem;
			background: var(--bg);
			color: var(--fg);
			font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
			font-size: 16px;
			line-height: 1.5;
			-webkit-font-smoothing: antialiased;
		}

		main { width: 100%; max-width: 26rem; }

		h1 {
			margin: 0;
			font-size: 1.5rem;
			font-weight: 500;
			letter-spacing: -0.02em;
		}

		nav {
			margin-top: 1.75rem;
			display: flex;
			flex-wrap: wrap;
			gap: 0.5rem 1.5rem;
		}

		a {
			color: var(--muted);
			text-decoration: none;
			font-size: 0.9375rem;
			transition: color 0.15s ease;
		}

		a:hover,
		a:focus-visible { color: var(--fg); }

		a:focus-visible {
			outline: 1px solid var(--fg);
			outline-offset: 3px;
			border-radius: 2px;
		}

		@media (prefers-reduced-motion: reduce) {
			a { transition: none; }
		}
	</style>
</head>
<body>
	<main>
		<h1>Bernat Fages</h1>
		<nav>
			<a href="https://x.com/brnt" rel="me">X</a>
			<a href="https://www.linkedin.com/in/bernatfp/" rel="me">LinkedIn</a>
			<a href="https://github.com/bernatfp" rel="me">GitHub</a>
			<a href="mailto:contact@bernat.xyz" rel="me">Email</a>
		</nav>
	</main>
</body>
</html>
